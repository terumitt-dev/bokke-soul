# =========================
# CI Pipeline
# =========================
kind: pipeline
type: kubernetes
name: ci

trigger:
  event: [push, pull_request]
  branch: [main]

node_selector:
  node-role: drone
tolerations:
  - key: dedicated
    value: drone
    effect: NoSchedule

steps:
  # Godot プロジェクトとして読み込めることを確認する。シークレットは参照しない。
  - name: godot-import
    image: barichello/godot-ci:4.7.2
    commands:
      # 書体を参照するテーマは、書体の取り込みより先に読まれると 1 回目にエラーを出す。2 回取り込むと確実に揃う
      - godot --headless --path game --import --quit || true
      - godot --headless --path game --import --quit

  # 歩ける仮シーンの動作テスト (床・壁・落下復帰)
  - name: walk-test
    image: barichello/godot-ci:4.7.2
    commands:
      - sh game/tests/run.sh walk_test

  # 点群から作ったメッシュ (GLB) を読み込んだ世界を、歩けることの動作テスト
  - name: world-test
    image: barichello/godot-ci:4.7.2
    commands:
      - sh game/tests/run.sh world_test

  # 実行時に指定した GLB を読み込んで歩けることの動作テスト (リポジトリ内のサンプルを使う)
  - name: world-local-test
    image: barichello/godot-ci:4.7.2
    commands:
      - sh game/tests/run.sh world_local_test

  # 昼夜 (時刻の進み方、設定、空の色、場面への反映) の動作テスト
  - name: day-night-test
    image: barichello/godot-ci:4.7.2
    commands:
      - sh game/tests/run.sh day_night_test

  # 天気 (決まり方、なめらかな移り変わり、色味、場面への反映) の動作テスト
  - name: weather-test
    image: barichello/godot-ci:4.7.2
    commands:
      - sh game/tests/run.sh weather_test

  # タイトル画面 (表示、メニュー、クレジット、出典) の動作テスト
  - name: title-test
    image: barichello/godot-ci:4.7.2
    commands:
      - sh game/tests/run.sh title_test

  # 三人称のプレイヤー (操作の名前、カメラ基準の移動、体の向き、カメラの壁よけ、視点操作) の動作テスト
  - name: player-test
    image: barichello/godot-ci:4.7.2
    commands:
      - sh game/tests/run.sh player_test

  # 点群の見せ方 (確かめた所の地図、点の生成、歩くと現れる、休むと広く現れる、設定) の動作テスト
  - name: reveal-test
    image: barichello/godot-ci:4.7.2
    commands:
      - sh game/tests/run.sh reveal_test

  # セーブ (保存と読み込み、壊れたセーブ、新しいバージョン、地図の復元、ゲームへの組み込み、タイトル画面) の動作テスト
  - name: save-test
    image: barichello/godot-ci:4.7.2
    commands:
      - sh game/tests/run.sh save_test

  # 地形の法線 (法線のない GLB でも、読み込む時に作ること。サンプルの世界に法線があること) の動作テスト
  - name: normals-test
    image: barichello/godot-ci:4.7.2
    commands:
      - sh game/tests/run.sh normals_test

  # マップの篝火 (データの .json の bonfire と name を、測量座標から置き、そこから始まり、名前を出して休めること) の動作テスト
  - name: area-bonfire-test
    image: barichello/godot-ci:4.7.2
    commands:
      - sh game/tests/run.sh area_bonfire_test

  # マップの一覧と、隣り合うマップの見つけ方 (測量座標から)、端の判定、座標の直しの動作テスト
  - name: world-registry-test
    image: barichello/godot-ci:4.7.2
    commands:
      - sh game/tests/run.sh world_registry_test

  # マップの端の出口 (隣のマップへ移る、着いた位置、暗転、続きから) の動作テスト
  - name: map-exit-test
    image: barichello/godot-ci:4.7.2
    commands:
      - sh game/tests/run.sh map_exit_test
