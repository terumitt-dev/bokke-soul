# =========================
# CI Pipeline
# =========================
kind: pipeline
type: kubernetes
name: ci

trigger:
  event: [push, pull_request]
  branch: [main]

node_selector:
  node-role: drone
tolerations:
  - key: dedicated
    value: drone
    effect: NoSchedule

steps:
  # Godot プロジェクトとして読み込めることを確認する。シークレットは参照しない。
  - name: godot-import
    image: barichello/godot-ci:4.7.2
    commands:
      - godot --headless --path game --import --quit

  # 歩ける仮シーンの動作テスト (床・壁・落下復帰)
  - name: walk-test
    image: barichello/godot-ci:4.7.2
    commands:
      - godot --headless --path game --script res://tests/walk_test.gd

  # 点群から作ったメッシュ (GLB) を読み込んだ世界を、歩けることの動作テスト
  - name: world-test
    image: barichello/godot-ci:4.7.2
    commands:
      - godot --headless --path game --script res://tests/world_test.gd

  # 実行時に指定した GLB を読み込んで歩けることの動作テスト (リポジトリ内のサンプルを使う)
  - name: world-local-test
    image: barichello/godot-ci:4.7.2
    commands:
      - godot --headless --path game --script res://tests/world_local_test.gd

  # 昼夜 (時刻の進み方、設定、空の色、場面への反映) の動作テスト
  - name: day-night-test
    image: barichello/godot-ci:4.7.2
    commands:
      - godot --headless --path game --script res://tests/day_night_test.gd

  # 天気 (決まり方、なめらかな移り変わり、色味、場面への反映) の動作テスト
  - name: weather-test
    image: barichello/godot-ci:4.7.2
    commands:
      - godot --headless --path game --script res://tests/weather_test.gd
